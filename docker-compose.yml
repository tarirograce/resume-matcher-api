services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resume_matcher_db
    restart: always
    environment:
      POSTGRES_DB: resume_matcher
      POSTGRES_USER: resume_matcher_user
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: